<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPTI 四重人格测试</title>
<meta name="description" content="14 道情境题，探索合作、主导、回避、竞争四种反应模式。FPTI 原创自我探索测试，非心理诊断。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="questions.js?v=2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: oklch(97% 0.012 75);
  --surface: oklch(99.5% 0.005 75);
  --ink: oklch(22% 0.015 60);
  --ink2: oklch(50% 0.015 65);
  --ink3: oklch(72% 0.01 70);
  --accent: oklch(62% 0.09 65);
  --accent-border: oklch(80% 0.06 70);
  --radius: 18px;
  --shadow: 0 2px 16px oklch(22% 0.015 60 / 0.07), 0 1px 3px oklch(22% 0.015 60 / 0.04);
  --shadow-hover: 0 8px 32px oklch(22% 0.015 60 / 0.12), 0 2px 8px oklch(22% 0.015 60 / 0.06);
  --shadow-sel: 0 4px 24px oklch(62% 0.09 65 / 0.2), 0 1px 4px oklch(62% 0.09 65 / 0.1);
}
html, body { height: 100%; background: var(--bg); font-family: 'Noto Serif SC', 'Songti SC', serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#root { min-height: 100vh; display: flex; flex-direction: column; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 200px 200px; pointer-events: none; z-index: 1000; opacity: 0.55;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
html { line-height:1.5; }
button { font: inherit; text-align: center; white-space:normal; overflow-wrap:anywhere; }
main, main * { min-width:0; }
main { overflow-wrap:anywhere; }
main p, main h1, main h2, main h3, main h4 { word-break:normal; overflow-wrap:anywhere; }
[role="radio"] { align-items:flex-start !important; }
[role="radio"] > :first-child { width:2rem !important; height:2rem !important; }
[role="radio"] > :last-child { margin-top:.25rem; }
@media (max-width:360px) {
  [role="radio"] { gap:10px !important; padding:16px 12px !important; }
  .intro-stats > div { padding:16px 8px !important; }
}
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
h2:focus { outline: none; }
.report-card { background:var(--surface);border:1px solid oklch(91% 0.012 72);border-radius:var(--radius);padding:22px 20px;margin-bottom:14px;box-shadow:var(--shadow); }
.report-title { font-size:0.875rem;color:var(--ink2);margin-bottom:14px;letter-spacing:.06em; }
.report-body { font-size:1rem;line-height:1.9;color:var(--ink2);overflow-wrap:anywhere; }
.mono { font-family:'DM Mono',monospace; }
.fpti-footer { padding-top:20px;border-top:1px dashed oklch(86% 0.02 72);margin-top:30px;font-size:0.75rem;line-height:1.9;color:var(--ink2);text-align:center; }
@media(max-width:360px) { .report-card { padding:20px 14px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important;transition:none !important;scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div id="root"><p style="padding:48px 24px;text-align:center;line-height:1.9">正在载入 FPTI 四重人格测试…<br>若长时间未出现页面，请检查网络后刷新。</p></div><noscript>请启用 JavaScript 后进行测试。</noscript>
<script type="text/babel">
const {useState,useEffect}=React;
const {TYPES,MODE_KEYS,QUESTIONS,calcResult}=window.FPTI;
function ProgressBar({ current, total }) {
  const pct = ((current-1)/total)*100;
  return (
    <div style={{padding:'28px 28px 0'}}>
      <div style={{position:'relative',height:3,background:'oklch(88% 0.012 70)',borderRadius:99,overflow:'visible'}}>
        <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,var(--accent-border),var(--accent))',borderRadius:99,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}/>
        <div style={{position:'absolute',top:-3.5,left:'calc('+pct+'% - 5px)',width:10,height:10,borderRadius:'50%',background:'var(--accent)',border:'2px solid var(--surface)',boxShadow:'0 0 0 3px oklch(62% 0.09 65 / 0.2)',transition:'left 0.6s cubic-bezier(0.4,0,0.2,1)',opacity:pct>0?1:0}}/>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
        <span style={{fontFamily:"'DM Mono',monospace",fontSize:'0.75rem',color:'var(--ink3)',letterSpacing:'0.04em'}}>
          {String(current).padStart(2,'0')} / {String(total).padStart(2,'0')}
        </span>
      </div>
    </div>
  );
}

// ─── OptionCard ───────────────────────────────────────────────────────────────
function OptionCard({ optKey, text, selected, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <button type="button" role="radio" aria-checked={selected} aria-label={optKey+"："+text} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        width:'100%',textAlign:'left',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,padding:'16px 20px',
        background: selected?'linear-gradient(135deg,oklch(97% 0.04 72),oklch(96% 0.05 68))':hov?'oklch(99% 0.008 72)':'var(--surface)',
        border: selected?'1.5px solid var(--accent-border)':hov?'1.5px solid oklch(85% 0.02 70)':'1.5px solid oklch(91% 0.012 72)',
        borderRadius:'var(--radius)',cursor:'pointer',
        transition:'all 0.2s cubic-bezier(0.4,0,0.2,1)',
        boxShadow: selected?'var(--shadow-sel)':hov?'var(--shadow-hover)':'var(--shadow)',
        transform: selected?'translateY(-2px) scale(1.005)':hov?'translateY(-1px)':'none',
        userSelect:'none',
      }}>
      <div style={{flexShrink:0,width:32,height:32,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'DM Mono',monospace",fontSize:'0.75rem',fontWeight:500,background:selected?'var(--accent)':hov?'oklch(93% 0.02 72)':'oklch(95% 0.014 72)',color:selected?'white':'var(--ink2)',transition:'all 0.2s'}}>
        {optKey}
      </div>
      <div style={{flex:1,minWidth:0,fontSize:'1rem',lineHeight:1.65,color:selected?'var(--ink)':'var(--ink2)',fontWeight:selected?500:400,letterSpacing:'0.01em',transition:'all 0.2s'}}>
        {text}
      </div>
      <div style={{flexShrink:0,width:18,height:18,borderRadius:'50%',background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',opacity:selected?1:0,transform:selected?'scale(1)':'scale(0.3)',transition:'all 0.25s cubic-bezier(0.34,1.56,0.64,1)'}}>
        <svg width="9" height="7" viewBox="0 0 9 7" fill="none">
          <path d="M1 3.5L3.2 6L8 1" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
    </button>
  );
}

// ─── QuizPage ─────────────────────────────────────────────────────────────────
function QuizPage({ question, questionNum, total, selectedAnswer, onAnswer, onNext, onPrevious }) {
  const canNext = selectedAnswer !== null;
  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <ProgressBar current={questionNum} total={total}/>
      <div key={'q'+question.id} style={{padding:'36px 28px 24px',animation:'fadeUp 0.35s ease both'}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:'0.75rem',letterSpacing:'0.14em',color:'var(--accent)',textTransform:'uppercase',marginBottom:14}}>
          Q{String(questionNum).padStart(2,'0')}
        </div>
        <h2 id="question-title" tabIndex={-1} style={{fontSize:'1.3125rem',fontWeight:500,lineHeight:1.65,color:'var(--ink)',letterSpacing:'0.02em',textWrap:'pretty'}}>
          {question.text}
        </h2>
      </div>
      <div role="radiogroup" aria-labelledby="question-title" onKeyDown={e=>{
  if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
  e.preventDefault();
  const active=question.options.findIndex(o=>o.key===selectedAnswer);
  const next=e.key==='Home'?0:e.key==='End'?3:(Math.max(active,0)+(['ArrowDown','ArrowRight'].includes(e.key)?1:3))%4;
  onAnswer(question.options[next].key);e.currentTarget.querySelectorAll('[role="radio"]')[next].focus();
}} key={'o'+question.id} style={{flex:1,padding:'0 18px',display:'flex',flexDirection:'column',gap:9}}>
        {question.options.map((opt,i)=>(
          <div key={opt.key} style={{animation:'fadeUp 0.35s ease both',animationDelay:(0.05+i*0.07)+'s'}}>
            <OptionCard optKey={opt.key} text={opt.text} selected={selectedAnswer===opt.key} onClick={()=>onAnswer(opt.key)}/>
          </div>
        ))}
      </div>
      <div style={{padding:'24px 18px 36px'}}>
        {questionNum>1 && <button type="button" onClick={onPrevious} style={{display:'block',border:'none',background:'transparent',color:'var(--ink2)',fontSize:'0.875rem',padding:'10px 0',marginBottom:10,cursor:'pointer'}}>← 上一题</button>}
        <button onClick={onNext} disabled={!canNext} style={{width:'100%',minHeight:52,height:'auto',padding:'14px 18px',lineHeight:1.6,flexShrink:0,borderRadius:14,border:'none',background:canNext?'linear-gradient(135deg,oklch(65% 0.1 68),oklch(58% 0.1 62))':'oklch(90% 0.01 72)',color:canNext?'white':'var(--ink3)',fontSize:'0.96875rem',fontFamily:"'Noto Serif SC',serif",fontWeight:500,letterSpacing:'0.06em',cursor:canNext?'pointer':'not-allowed',transition:'all 0.25s',boxShadow:canNext?'0 4px 20px oklch(62% 0.1 65 / 0.32)':'none'}}
          onMouseEnter={e=>{if(canNext)e.currentTarget.style.transform='translateY(-2px)';}}
          onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';}}>
          {questionNum===total?'查看我的四重人格':'下一题'}
        </button>
      </div>
    </div>
  );
}


function Footer() {
  return <footer className="fpti-footer">
    <p>原创自我探索与娱乐测试，未经心理测量学验证。<br/>四种“人格”指反应模式，不代表独立身份或心理诊断。</p>
    <p style={{marginTop:8}}>答案仅保留在当前页面，刷新后清空。</p>
    <p style={{marginTop:12}}>有任何想法欢迎联系作者<br/><a href="mailto:wsr_19980225@163.com" style={{color:'var(--accent)',overflowWrap:'anywhere'}}>wsr_19980225@163.com</a></p>
    <p className="mono" style={{marginTop:10,letterSpacing:'.1em'}}>© FPTI · 2026</p>
  </footer>;
}
function ResultPage({ resultData, onRetry }) {
  const { scores, leaders, ranked, shares, contexts, total } = resultData;
  const names = keys => keys.map(k=>TYPES[k].name).join(' / ');
  const heading = leaders.length>1 ? '并列主导' : TYPES[leaders[0]].name;
  return <div style={{minHeight:'100vh',padding:'44px 20px 48px',animation:'fadeIn .5s ease both'}}>
    <p className="mono" style={{textAlign:'center',fontSize:'0.75rem',letterSpacing:'.16em',color:'var(--accent)',marginBottom:22}}>YOUR FOURFOLD PROFILE</p>
    <div className="report-card" style={{background:'linear-gradient(145deg,var(--surface),oklch(97% 0.025 72))',border:'1.5px solid var(--accent-border)',borderRadius:24,padding:'28px 24px',boxShadow:'var(--shadow-sel)'}}>
      <p style={{fontSize:'0.875rem',color:'var(--ink2)',marginBottom:8}}>这次回答中的主导模式</p>
      <h2 id="result-title" tabIndex={-1} style={{fontSize:'1.75rem',fontWeight:500,lineHeight:1.5}}>{heading}</h2>
      <p className="mono" style={{fontSize:'0.875rem',color:'var(--accent)',margin:'10px 0 18px'}}>{leaders.map(k=>'FPTI-'+TYPES[k].id).join(' / ')}</p>
      {leaders.length===1
        ? <><p style={{borderLeft:'3px solid var(--accent)',background:'oklch(96% 0.02 72)',borderRadius:11,padding:'13px 15px',fontSize:'1rem',lineHeight:1.8,marginBottom:16}}>{TYPES[leaders[0]].line}</p><p className="report-body">{TYPES[leaders[0]].desc}</p></>
        : <p className="report-body">{names(leaders)+'得到相同的最高分。这次回答不足以把你归为其中一种，请结合具体情境理解。'}</p>}
    </div>
    <section className="report-card" aria-labelledby="distribution-title">
      <h3 className="report-title" id="distribution-title">四重人格分布</h3>
      {ranked.map(k=><div key={k} style={{marginBottom:16}}>
        <div style={{display:'flex',flexWrap:'wrap',justifyContent:'space-between',gap:8,alignItems:'baseline',marginBottom:8}}>
          <span style={{fontSize:'1rem'}}>{TYPES[k].id} 号 · {TYPES[k].name}</span>
          <span className="mono" style={{fontSize:'0.875rem',color:'var(--ink2)',whiteSpace:'normal',overflowWrap:'anywhere'}}>{scores[k]}/{total} · {shares[k].toFixed(1)}%</span>
        </div>
        <div role="meter" aria-label={TYPES[k].name+'得分'} aria-valuemin={0} aria-valuemax={total} aria-valuenow={scores[k]} style={{height:6,background:'oklch(91% 0.012 72)',borderRadius:99,overflow:'hidden'}}>
          <div style={{height:'100%',width:shares[k]+'%',background:leaders.includes(k)?'linear-gradient(90deg,var(--accent-border),var(--accent))':'oklch(78% 0.035 70)',borderRadius:99}}/>
        </div>
      </div>)}
      <p style={{fontSize:'0.75rem',lineHeight:1.8,color:'var(--ink2)'}}>每题计 1 分；百分比是这次答案的得分占比，不是准确率、人口排名或固定人格比例。四舍五入可能造成合计略有误差。</p>
    </section>
    <section className="report-card">
      <h3 className="report-title">哪些情境里，你会换一种反应？</h3>
      {contexts.map((ctx,i)=><div key={ctx.key} style={{padding:'14px 0',borderTop:i?'1px dashed oklch(87% 0.02 72)':'none'}}>
        <div style={{fontSize:'1rem',marginBottom:5}}>{ctx.label}</div>
        <p style={{fontSize:'0.875rem',color:'var(--accent)',lineHeight:1.7}}>{ctx.leaders.length===4 ? '四种模式各出现一次' : names(ctx.leaders)+(ctx.leaders.length>1?'并列':'更常出现')}</p>
        <p style={{fontSize:'0.75rem',lineHeight:1.9,color:'var(--ink2)',marginTop:4}}>{MODE_KEYS.map(k=>TYPES[k].name+' '+ctx.scores[k]+'/'+ctx.total).join(' · ')}</p>
      </div>)}
      <p style={{fontSize:'0.75rem',lineHeight:1.8,color:'var(--ink2)',marginTop:8}}>每类情境包含 2–3 题。这是本次选择的摘要，不能说明某个场景必然触发某种反应。</p>
    </section>
    {ranked.map(k=>{const info=TYPES[k];return <section key={k} className="report-card">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <span className="mono" style={{width:38,height:38,borderRadius:10,background:info.color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'1rem'}}>{info.id}</span>
        <div><h3 style={{fontSize:'1.125rem',fontWeight:500}}>{info.name} · {info.role}</h3><p style={{fontSize:'0.75rem',color:'var(--ink2)',marginTop:4}}>{info.tag}</p></div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:16}}>{info.traits.map(t=><span key={t} style={{fontSize:'0.75rem',padding:'4px 11px',borderRadius:99,background:'oklch(93% 0.03 72)',border:'1px solid oklch(87% 0.03 72)',color:'var(--ink2)'}}>{t}</span>)}</div>
      {[['能派上用场的地方',info.strength],['容易付出的代价',info.risk],['可以试的一小步',info.action]].map(([title,text])=><div key={title} style={{marginTop:14}}><h4 style={{fontSize:'0.875rem',fontWeight:500,marginBottom:5}}>{title}</h4><p className="report-body">{text}</p></div>)}
    </section>})}
    <button onClick={onRetry} style={{width:'100%',minHeight:52,height:'auto',padding:'14px 18px',lineHeight:1.6,flexShrink:0,borderRadius:14,border:'1.5px solid oklch(85% 0.04 70)',background:'transparent',color:'var(--ink2)',fontSize:'1rem',cursor:'pointer'}}>重新测试</button>
    <Footer/>
  </div>;
}
function App() {
  const [screen, setScreen] = useState('intro');
  const [currentQ, setCurrentQ] = useState(0);
  const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));
  const [resultData, setResultData] = useState(null);
  useEffect(()=>{
    window.scrollTo(0,0);
    const title=document.getElementById(screen==='quiz'?'question-title':'result-title');
    if(title)title.focus({preventScroll:true});
  },[screen,currentQ]);
  function handleStart() { setCurrentQ(0);setAnswers(Array(QUESTIONS.length).fill(null));setResultData(null);setScreen('quiz'); }
  function handleAnswer(key) { if(!QUESTIONS[currentQ].options.some(o=>o.key===key))return;setAnswers(prev=>{const next=[...prev];next[currentQ]=key;return next;}); }
  function handleNext() {
    if(!answers[currentQ])return;
    if(currentQ===QUESTIONS.length-1){setResultData(calcResult(answers));setScreen('result');}
    else setCurrentQ(q=>q+1);
  }
  return <main style={{width:'100%',maxWidth:480,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>
    {screen==='intro' && <IntroPage onStart={handleStart}/>}
    {screen==='quiz' && <QuizPage key={currentQ} question={QUESTIONS[currentQ]} questionNum={currentQ+1} total={QUESTIONS.length} selectedAnswer={answers[currentQ]} onAnswer={handleAnswer} onNext={handleNext} onPrevious={()=>setCurrentQ(q=>Math.max(0,q-1))}/>}
    {screen==='result' && <ResultPage resultData={resultData} onRetry={handleStart}/>}
  </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
function IntroPage({ onStart }) {
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',padding:'60px 32px',animation:'fadeIn 0.6s ease both'}}>
      <div style={{display:'flex',justifyContent:'center',marginBottom:44}}>
        <svg width="68" height="68" viewBox="0 0 68 68" fill="none">
          <circle cx="34" cy="34" r="32" stroke="oklch(80% 0.05 70)" strokeWidth="1.5"/>
          <circle cx="34" cy="34" r="20" stroke="oklch(72% 0.07 68)" strokeWidth="1" strokeDasharray="3 3"/>
          <circle cx="34" cy="34" r="9" fill="oklch(72% 0.09 65)" opacity="0.85"/>
          {[0,45,90,135,180,225,270,315].map((deg,i)=>(
            <line key={i} x1={34+13*Math.cos(deg*Math.PI/180)} y1={34+13*Math.sin(deg*Math.PI/180)} x2={34+30*Math.cos(deg*Math.PI/180)} y2={34+30*Math.sin(deg*Math.PI/180)} stroke="oklch(75% 0.06 68)" strokeWidth="1" opacity="0.55"/>
          ))}
        </svg>
      </div>
      <div style={{marginBottom:8}}>
        <span style={{fontFamily:"'DM Mono',monospace",fontSize:'0.75rem',letterSpacing:'0.18em',color:'var(--accent)',textTransform:'uppercase'}}>FPTI · Fourfold Personality</span>
      </div>
      <h1 style={{fontSize:'1.9375rem',fontWeight:500,lineHeight:1.45,color:'var(--ink)',marginBottom:18,letterSpacing:'0.02em'}}>关键时刻，<br/>哪一面在主导你？</h1>
      <p style={{fontSize:'1rem',lineHeight:1.9,color:'var(--ink2)',marginBottom:44,letterSpacing:'0.02em',maxWidth:360}}>
        {QUESTIONS.length} 个问题，4 种反应模式。回想最近一个月的真实反应，选最接近你的答案，不选理想中的自己。
      </p>
      <div className="intro-stats" style={{display:'flex',flexWrap:'wrap',marginBottom:44,background:'var(--surface)',borderRadius:'var(--radius)',border:'1px solid oklch(91% 0.012 72)',overflow:'hidden',boxShadow:'var(--shadow)'}}>
        {[{num:QUESTIONS.length,label:'道题目'},{num:'4',label:'种模式'},{num:'3′',label:'完成时间'}].map((item,i)=>(
          <div key={i} style={{flex:'1 1 5rem',minWidth:0,padding:'20px 12px',textAlign:'center',borderRight:i<2?'1px solid oklch(91% 0.012 72)':'none'}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:'1.375rem',color:'var(--ink)',marginBottom:4}}>{item.num}</div>
            <div style={{fontSize:'0.75rem',color:'var(--ink3)',letterSpacing:'0.04em'}}>{item.label}</div>
          </div>
        ))}
      </div>
      <button onClick={onStart}
        style={{minHeight:56,height:'auto',padding:'14px 18px',lineHeight:1.6,flexShrink:0,borderRadius:14,border:'none',background:'linear-gradient(135deg,oklch(65% 0.1 68),oklch(58% 0.1 62))',color:'white',fontSize:'1.0625rem',fontFamily:"'Noto Serif SC',serif",fontWeight:500,letterSpacing:'0.06em',cursor:'pointer',boxShadow:'0 6px 24px oklch(62% 0.1 65 / 0.38)',transition:'all 0.25s'}}
        onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 10px 32px oklch(62% 0.1 65 / 0.45)';}}
        onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 6px 24px oklch(62% 0.1 65 / 0.38)';}}>
        开始测试
      </button>
      <p style={{textAlign:'center',marginTop:14,fontSize:'0.75rem',color:'var(--ink2)',letterSpacing:'0.03em'}}>同一个人，也会在不同情境里切换</p><Footer/>
    </div>
  );
}


</script>
</body>
</html>
